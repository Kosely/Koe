# ============================================================
#  SwiftPvP-Guild - messages.yml
#  Tous les messages du plugin (chat, erreurs, aide, stats, formats de chat, callout...).
#
#  DÉSACTIVER UN MESSAGE (il ne s'affiche plus du tout) :
#    1) remplacer son texte par  false        ->   no-permission: false
#    2) ou l'écrire en section avec deny: true :
#         no-permission:
#           text: "&cVous n'avez pas la permission."
#           deny: true
#  Mettre deny: false (ou le retirer) le réactive.
#  Si vous supprimez une clé du fichier, elle est automatiquement rajoutée
#  (avec sa valeur par défaut) au prochain démarrage / reload.
#
#  Variables : {player} {name} {tag} {guild} {message} ... selon le message.
#  Les couleurs utilisent le code &.
#  Les textes des interfaces (menus) sont dans le dossier interfaces/ (un fichier par interface).
# ============================================================


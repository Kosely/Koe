# ============================================================
#  SwiftPvP-Guild - interfaces/war-setup.yml
#  Une interface = un fichier. Tout est modifiable : title, size (9 à 54, multiple de 9),
#  filler, decorations, et pour chaque item : slot, material, name, lore, amount, glow,
#  custom-model-data, hide-flags, hide-tooltip, skull-viewer, enabled (false = item retiré),
#  permission (permission de rôle requise pour voir l'item).
#  Couleurs avec &. Variables entre accolades propres à chaque interface (voir plus bas).
#  Les placeholders PlaceholderAPI (%...%) fonctionnent dans les noms et lores.
#  /guild reload recharge ce fichier.
# ============================================================

# ------------------------------------------------------------
# Configuration d'une guerre
# Variables : {side} {hint} {minutes} {points} {dstep} {pstep} {targets} {ppk}
# ------------------------------------------------------------
title: "&8Nouvelle guerre"
size: 54
filler:
  enabled: false
  material: GRAY_STAINED_GLASS_PANE
  name: " "
texts:
  none: "&7Aucun"
  target-guild: "&c{tag}"
  target-alliance: "&d{tag} &7(alliance)"
  hint-toggle: "&7Clic : guilde seule / alliance"
  hint-no-alliance: "&7(pas d'alliance)"
items:
  side-guild:
    slot: 10
    material: BLUE_BANNER
    name: "&9Votre camp"
    lore:
      - "&f{side}"
      - "{hint}"
  side-alliance:
    slot: 10
    material: PURPLE_BANNER
    name: "&9Votre camp &7(alliance)"
    lore:
      - "&f{side}"
      - "{hint}"
  minus-duration:
    slot: 19
    material: RED_CONCRETE
    name: "&c- {dstep} min"
  duration:
    slot: 20
    material: CLOCK
    name: "&7Durée : &f{minutes} minutes"
  plus-duration:
    slot: 21
    material: LIME_CONCRETE
    name: "&a+ {dstep} min"
  minus-points:
    slot: 23
    material: RED_CONCRETE
    name: "&c- {pstep} points"
  points:
    slot: 24
    material: DIAMOND
    name: "&7Objectif : &f{points} points"
  plus-points:
    slot: 25
    material: LIME_CONCRETE
    name: "&a+ {pstep} points"
  targets:
    slot: 31
    material: TARGET
    name: "&c&lAdversaires"
    lore:
      - "{targets}"
      - ""
      - "&eClic pour sélectionner"
  start:
    slot: 40
    material: LIME_DYE
    name: "&a&lLancer la guerre"
    lore:
      - "&7{ppk} points par kill"
  back:
    slot: 49
    material: ARROW
    name: "&7Retour"

# ============================================================
#  SwiftPvP-Guild - interfaces/guild-menu-basic.yml
#  Une interface = un fichier. Tout est modifiable : title, size (9 à 54, multiple de 9),
#  filler, decorations, et pour chaque item : slot, material, name, lore, amount, glow,
#  custom-model-data, hide-flags, hide-tooltip, skull-viewer, enabled (false = item retiré),
#  permission (permission de rôle requise pour voir l'item).
#  Couleurs avec &. Variables entre accolades propres à chaque interface (voir plus bas).
#  Les placeholders PlaceholderAPI (%...%) fonctionnent dans les noms et lores.
#  /guild reload recharge ce fichier.
# ============================================================

# Disposition pour un joueur sans permission (mêmes variables que guild-menu)
title: "&8GUILD"
size: 45
filler:
  enabled: false
  material: GRAY_STAINED_GLASS_PANE
  name: " "
decorations:
  glass:
    slots: "0,1,7,8,9,17,27,35,36,37,43,44"
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    name: " "
    hide-tooltip: true
items:
  banner:
    slot: 4
    material: WHITE_BANNER
    name: "{guild_color}&l{guild_name} &8[{guild_color}{guild_tag}&8]"
    lore:
      - "&7Nom : &f{guild_name}"
      - "&7Owner : &f{guild_owner}"
      - "&7Création : &f{guild_created}"
      - "&7MOTD : &f{guild_motd}"
      - ""
      - "&7Votre rôle : &f{guild_role}"
      - "&7Chat de guilde : {guild_chat}"
  head:
    slot: 19
    material: PLAYER_HEAD
    skull-viewer: true
    name: "&e&lMembres"
    lore:
      - "&7{guild_members} membre(s) &8| &a{guild_online} en ligne"
      - ""
      - "&eClic pour ouvrir"
  stats:
    slot: 22
    material: EXPERIENCE_BOTTLE
    name: "&a&lStatistiques"
    lore:
      - "&7Statistiques de la guilde"
      - ""
      - "&eClic pour ouvrir"
  relations:
    slot: 25
    material: SHIELD
    name: "&9&lRelations"
    lore:
      - "&7Ennemis et alliés"
      - ""
      - "&eClic pour ouvrir"
  settings:
    slot: 40
    material: REDSTONE
    name: "&c&lParamètres"
    lore:
      - "&7Paramètres de la guilde"
      - ""
      - "&eClic pour ouvrir"

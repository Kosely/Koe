# ============================================================
#  SwiftPvP-Guild - interfaces/war-targets.yml
#  Une interface = un fichier. Tout est modifiable : title, size (9 à 54, multiple de 9),
#  filler, decorations, et pour chaque item : slot, material, name, lore, amount, glow,
#  custom-model-data, hide-flags, hide-tooltip, skull-viewer, enabled (false = item retiré),
#  permission (permission de rôle requise pour voir l'item).
#  Couleurs avec &. Variables entre accolades propres à chaque interface (voir plus bas).
#  Les placeholders PlaceholderAPI (%...%) fonctionnent dans les noms et lores.
#  /guild reload recharge ce fichier.
# ============================================================

# ------------------------------------------------------------
# Sélection des adversaires (guildes / alliances)
# Modèles. Variables : {tag} {name} {state} ; boutons : {page} {pages}
# ------------------------------------------------------------
title: "&8Choisir les adversaires"
size: 54
filler:
  enabled: false
  material: GRAY_STAINED_GLASS_PANE
  name: " "
entry-slots: "0-35"
texts:
  selected: "&aSélectionné"
  unselected: "&7Clic pour sélectionner"
items:
  entry-guild:
    material: RED_BANNER
    name: "&c{tag} &7({name})"
    lore:
      - "&7Guilde"
      - "{state}"
  entry-alliance:
    material: PURPLE_BANNER
    name: "&d{tag} &7({name})"
    lore:
      - "&7Alliance"
      - "{state}"
  prev:
    slot: 45
    material: ARROW
    name: "&7Page précédente"
  next:
    slot: 53
    material: ARROW
    name: "&7Page suivante"
  done:
    slot: 49
    material: LIME_DYE
    name: "&a&lValider"
    lore:
      - "&7Page {page}/{pages}"
